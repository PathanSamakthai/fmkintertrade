      field('f-phone', esc(f.phone)+' '+req, '<input id="f-phone" name="phone" type="tel" value="'+esc(fm.phone)+'" style="'+inputStyle()+'">', e.phone)+
      field('f-solution', esc(f.solution), '<select id="f-solution" name="solution" style="'+inputStyle()+'">'+selectOptions(f.solutionOpts, fm.solution)+'</select>')+
      field('f-ptype', esc(f.projectType), '<select id="f-ptype" name="projectType" style="'+inputStyle()+'">'+selectOptions(f.projectTypeOpts, fm.projectType)+'</select>')+
      '<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><label for="f-message" style="font-size:13px;font-weight:600;color:#1A1A1A">'+esc(f.message)+'</label><textarea id="f-message" name="message" rows="3" style="'+inputStyle()+';resize:vertical">'+esc(fm.message)+'</textarea></div>'+
      '<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:#1A1A1A">'+esc(f.contactMethod)+'</span><div style="display:flex;gap:18px;flex-wrap:wrap">'+radios+'</div></div>'+
      '<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#3B4148;cursor:pointer;line-height:1.5"><input type="checkbox" name="consent"'+(fm.consent?' checked':'')+' style="accent-color:#1A1A1A;width:17px;height:17px;margin-top:1px;flex-shrink:0">'+esc(f.consent)+'</label>'+(e.consent?'<span style="font-size:12px;color:#b4232a">'+esc(e.consent)+'</span>':'')+'</div>'+
      '<div style="grid-column:1/-1;display:flex;gap:12px;margin-top:6px"><button type="submit"'+(state.submitting?' disabled':'')+' class="btn-green" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#0E5B91;color:#fff;border:none;padding:14px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;opacity:'+(state.submitting?'.65':'1')+';transition:background .2s">'+esc(state.submitting?f.submitting:f.submit)+'</button></div>'+
    '</form>';
  }
  return '<div style="position:fixed;inset:0;z-index:1600;display:flex;align-items:center;justify-content:center;padding:16px">'+
    '<div data-action="close-modal" style="position:absolute;inset:0;background:rgba(6,27,20,.6);backdrop-filter:blur(3px)"></div>'+
    '<div role="dialog" aria-modal="true" aria-labelledby="consult-title" style="position:relative;width:min(640px,100%);max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(6,27,20,.4)">'+
      '<div style="position:sticky;top:0;background:#0C2E48;color:#fff;padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-start;border-radius:20px 20px 0 0;z-index:2">'+
        '<div><div style="font-size:11px;font-weight:700;letter-spacing:.16em;color:#C9A050">'+esc(f.eyebrow)+'</div><h2 id="consult-title" style="font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.01em">'+esc(f.title)+'</h2><p style="font-size:13px;color:rgba(255,255,255,.72);margin-top:6px;max-width:44ch">'+esc(f.sub)+'</p></div>'+
        '<button type="button" data-action="close-modal" aria-label="'+esc(f.close)+'" style="flex-shrink:0;width:38px;height:38px;border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '</div>'+
      '<div style="padding:26px 28px">'+
        '<div style="background:#F4F7F5;border:1px solid #DCE3DF;border-radius:10px;padding:10px 14px;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;color:#68736E;margin-bottom:22px">'+esc(f.demoBadge)+'</div>'+
        body+
      '</div>'+
    '</div></div>';
}

/* ---------- render orchestration ---------- */
function renderPage(){
  var t=T[state.lang];
  document.documentElement.lang=state.lang;
  document.getElementById('skip').textContent=t.skip;
  document.getElementById('page').innerHTML =
    renderTopBar(t)+renderHeader(t)+
    '<main id="main"><span id="top"></span>'+
    renderHero(t)+renderTrust(t)+renderAbout(t)+renderSolutions(t)+renderProjects(t)+renderWhy(t)+renderNetwork(t)+renderKnowledge(t)+renderFinalCta(t)+
    '</main>'+renderFooter(t);
  applyScroll();
  observeReveal();
}
function renderLayer(){
  var t=T[state.lang];
  document.getElementById('layer').innerHTML = renderMenu(t)+renderModal(t);
  document.body.style.overflow = (state.menuOpen || state.modalOpen) ? 'hidden' : '';
}

/* ---------- interactions ---------- */
function applyScroll(){
  var h=document.getElementById('siteHeader'); if(!h) return;
  if(window.scrollY>24) h.classList.add('scrolled'); else h.classList.remove('scrolled');
}
var revealObserver;
function observeReveal(){
  var els=Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !('IntersectionObserver' in window)){ els.forEach(function(el){el.classList.add('is-visible');}); return; }
  if(revealObserver) revealObserver.disconnect();
  revealObserver=new IntersectionObserver(function(ents){ ents.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('is-visible'); revealObserver.unobserve(e.target); } }); },{threshold:0.1, rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(el){ revealObserver.observe(el); });
  setTimeout(function(){ els.forEach(function(el){el.classList.add('is-visible');}); }, 1800);
}

function readForm(){
  var g=function(id){ var el=document.getElementById(id); return el?el.value:''; };
  var cm=document.querySelector('input[name="contactMethod"]:checked');
  var cc=document.querySelector('input[name="consent"]');
  state.form={ fullName:g('f-name'), company:g('f-company'), position:g('f-position'), country:g('f-country'), email:g('f-email'), phone:g('f-phone'), solution:g('f-solution'), projectType:g('f-ptype'), message:g('f-message'), contactMethod:cm?cm.value:'', consent:cc?cc.checked:false };
}
function validate(){
  var f=state.form, t=T[state.lang].form, e={};
  if(!f.fullName.trim()) e.fullName=t.errRequired;
  if(!f.company.trim()) e.company=t.errRequired;
  if(!f.email.trim()) e.email=t.errRequired; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email=t.errEmail;
  if(!f.phone.trim()) e.phone=t.errRequired; else if(!/^[+()\d][\d\s().-]{6,}$/.test(f.phone)) e.phone=t.errPhone;
  if(!f.consent) e.consent=t.errConsent;
  return e;
}

function setLang(l){ if(l!==state.lang){ state.lang=l; renderPage(); renderLayer(); } }
function openMenu(){ state.menuOpen=true; renderLayer(); }
function closeMenu(){ state.menuOpen=false; renderLayer(); }
function openModal(){ state.modalOpen=true; state.menuOpen=false; state.demoNotice=false; state.errors={}; renderLayer(); }
function closeModal(){ state.modalOpen=false; renderLayer(); }

document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-action]'); if(!el) return;
  var a=el.getAttribute('data-action');
  if(a==='lang'){ setLang(el.getAttribute('data-lang')); }
  else if(a==='open-menu'){ openMenu(); }
  else if(a==='close-menu'){ closeMenu(); }
  else if(a==='nav-close'){ closeMenu(); }
  else if(a==='open-modal'){ openModal(); }
  else if(a==='close-modal'){ closeModal(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){ if(state.modalOpen) closeModal(); else if(state.menuOpen) closeMenu(); }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.getAttribute && ev.target.getAttribute('data-action')==='lang'){ ev.preventDefault(); setLang(ev.target.getAttribute('data-lang')); }
});
document.addEventListener('submit', function(ev){
  if(ev.target.id!=='consultForm') return;
  ev.preventDefault();
  if(state.submitting) return;
  readForm();
  var e=validate();
  if(Object.keys(e).length){ state.errors=e; renderLayer(); return; }
  state.errors={}; state.submitting=true; renderLayer();
  /* DEMO ONLY — no backend. Replace this timeout with a real fetch() POST. */
  setTimeout(function(){ state.submitting=false; state.demoNotice=true; renderLayer(); }, 900);
});
window.addEventListener('scroll', applyScroll, {passive:true});

/* ---------- boot ---------- */
renderPage();
renderLayer();
</script>
</body>
</html>
